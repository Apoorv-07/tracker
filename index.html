*{box-sizing:border-box;margin:0;padding:0}

.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.stat-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px}

.progress-bar-fill{height:100%;background:var(--color-text-success);border-radius:4px;transition:width 0.4s}

.phase-block{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:8px;background:var(--color-background-primary);overflow:hidden}
.phase-block.done{border-color:var(--color-border-success)}

.phase-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
.phase-head:hover{background:var(--color-background-secondary)}

.phase-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.phase-name{font-size:13px;font-weight:500;flex:1;min-width:0}
.phase-pct{font-size:12px;color:var(--color-text-tertiary);white-space:nowrap;margin-right:6px}
.chevron{font-size:11px;color:var(--color-text-tertiary);transition:transform 0.2s;flex-shrink:0}

.phase-mini-bar{height:3px;background:var(--color-background-secondary)}
.phase-mini-fill{height:100%;background:var(--color-text-success);transition:width 0.3s}

.phase-body{display:none;padding:12px 14px;border-top:0.5px solid var(--color-border-tertiary)}
.phase-body.open{display:block}

.section-label{font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.04em;margin:12px 0 6px}

.item-row{display:flex;align-items:flex-start;gap:10px;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.item-row:last-child{border-bottom:none}
.item-row label{display:flex;align-items:flex-start;gap:10px;cursor:pointer;flex:1;font-size:13px;color:var(--color-text-secondary);line-height:1.4}
.item-row input[type=checkbox]{width:14px;height:14px;flex-shrink:0;margin-top:1px;cursor:pointer;accent-color:var(--color-text-success)}
.item-row.checked label{color:var(--color-text-tertiary);text-decoration:line-through;text-decoration-color:var(--color-border-secondary)}
.critical-badge{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--color-background-warning);color:var(--color-text-warning);border:0.5px solid var(--color-border-warning);white-space:nowrap;flex-shrink:0;margin-top:2px}
.new-badge{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--color-background-success);color:var(--color-text-success);border:0.5px solid var(--color-border-success);white-space:nowrap;flex-shrink:0;margin-top:2px}

.log-section{margin-top:12px;border-top:0.5px solid var(--color-border-tertiary);padding-top:10px}
.log-input-row{display:flex;gap:6px;margin-bottom:8px}
.log-input-row input{flex:1;font-size:12px;padding:5px 8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary)}
.log-input-row button{font-size:12px;padding:5px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer}
.log-input-row button:hover{background:var(--color-background-secondary)}
.log-entry{font-size:12px;color:var(--color-text-secondary);padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;justify-content:space-between;gap:8px}

.no-logs{font-size:12px;color:var(--color-text-tertiary);padding:4px 0}

.reset-btn{font-size:11px;color:var(--color-text-tertiary);cursor:pointer;background:none;border:none;padding:0}

let state = {};
let logs = {};

function loadState(){
  try{ state=JSON.parse(localStorage.getItem('gmle_state')||'{}'); }catch(e){state={};}
  try{ logs=JSON.parse(localStorage.getItem('gmle_logs')||'{}'); }catch(e){logs={};}
}

function saveState(){
  try{
    localStorage.setItem('gmle_state', JSON.stringify(state));
    localStorage.setItem('gmle_logs', JSON.stringify(logs));
  }catch(e){}
}

function getAllItems(){
  let all=[];
  PHASES.forEach(p=>p.sections.forEach(s=>s.items.forEach(i=>all.push(i))));
  return all;
}

function phaseItems(p){
  let all=[];
  p.sections.forEach(s=>s.items.forEach(i=>all.push(i)));
  return all;
}

function updateStats(){
  const all=getAllItems();
  const total=all.length;
  const done=all.filter(i=>state[i.id]).length;
  const phaseDone=PHASES.filter(p=>phaseItems(p).every(i=>state[i.id])).length;
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-phases').textContent=phaseDone+'/'+PHASES.length;
  document.getElementById('s-pct').textContent=pct+'%';
  document.getElementById('main-bar').style.width=pct+'%';
  PHASES.forEach(p=>{
    const items=phaseItems(p);
    const pdone=items.filter(i=>state[i.id]).length;
    const ppct=items.length>0?Math.round(pdone/items.length*100):0;
    const fillEl=document.getElementById('mf-'+p.id);
    const pctEl=document.getElementById('pp-'+p.id);
    const block=document.getElementById('pb-'+p.id);
    if(fillEl) fillEl.style.width=ppct+'%';
    if(pctEl) pctEl.textContent=pdone+'/'+items.length;
    if(block) block.classList.toggle('done', ppct===100);
  });
}

function renderPhases(){
  const c=document.getElementById('phases-container');
  c.innerHTML='';
  PHASES.forEach(p=>{
    const items=phaseItems(p);
    const done=items.filter(i=>state[i.id]).length;
    const pct=items.length>0?Math.round(done/items.length*100):0;

    const block=document.createElement('div');
    block.className='phase-block';
    block.id='pb-'+p.id;

    let sectionsHTML='';
    p.sections.forEach(s=>{
      sectionsHTML+=`<div class="section-label">${s.title}</div>`;
      s.items.forEach(i=>{
        const badge=i.tag==='critical'?`<span class="critical-badge">critical</span>`:i.tag==='new'?`<span class="new-badge">added</span>`:'';
        sectionsHTML+=`<div class="item-row ${state[i.id]?'checked':''}" id="row-${i.id}">
          <label>
            <input type="checkbox" ${state[i.id]?'checked':''} onchange="toggleItem('${i.id}',this.checked)">
            ${i.text}
          </label>${badge}</div>`;
      });
    });

    const logEntries=(logs[p.id]||[]).map((e,idx)=>
      `<div class="log-entry"><span>${e.text}</span><span style="display:flex;gap:8px;align-items:center"><span class="log-date">${e.date}</span><span class="log-del" onclick="deleteLog('${p.id}',${idx})">✕</span></span></div>`
    ).join('') || `<div class="no-logs">No notes yet</div>`;

    block.innerHTML=`
      <div class="phase-head" onclick="togglePhase('${p.id}')">
        <div class="phase-badge" style="background:${p.color};color:${p.tc};border:0.5px solid ${p.bc}">${p.label}</div>
        <div class="phase-name">${p.name}</div>
        <div class="phase-pct" id="pp-${p.id}">${done}/${items.length}</div>
        <div class="chevron" id="ch-${p.id}">▼</div>
      </div>
      <div class="phase-mini-bar"><div class="phase-mini-fill" id="mf-${p.id}" style="width:${pct}%"></div></div>
      <div class="phase-body" id="body-${p.id}">
        ${sectionsHTML}
        <div class="log-section">
          <div class="section-label">Progress notes</div>
          <div class="log-input-row">
            <input type="text" id="li-${p.id}" placeholder="Log a note, date completed, resource used..." onkeydown="if(event.key==='Enter')addLog('${p.id}')">
            <button onclick="addLog('${p.id}')">Add</button>
          </div>
          <div id="logs-${p.id}">${logEntries}</div>
        </div>
      </div>`;
    c.appendChild(block);
  });
}

function togglePhase(pid){
  const body=document.getElementById('body-'+pid);
  const ch=document.getElementById('ch-'+pid);
  const open=body.classList.contains('open');
  body.classList.toggle('open',!open);
  ch.style.transform=open?'':'rotate(180deg)';
}

function toggleItem(id,checked){
  state[id]=checked;
  const row=document.getElementById('row-'+id);
  if(row) row.classList.toggle('checked',checked);
  saveState();
  updateStats();
}

function addLog(pid){
  const input=document.getElementById('li-'+pid);
  const text=input.value.trim();
  if(!text) return;
  if(!logs[pid]) logs[pid]=[];
  const d=new Date();
  const date=d.getDate().toString().padStart(2,'0')+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getFullYear();
  logs[pid].unshift({text,date});
  input.value='';
  saveState();
  rerenderLogs(pid);
}

function deleteLog(pid,idx){
  if(!logs[pid]) return;
  logs[pid].splice(idx,1);
  saveState();
  rerenderLogs(pid);
}

function rerenderLogs(pid){
  const c=document.getElementById('logs-'+pid);
  if(!c) return;
  const entries=(logs[pid]||[]).map((e,idx)=>
    `<div class="log-entry"><span>${e.text}</span><span style="display:flex;gap:8px;align-items:center"><span class="log-date">${e.date}</span><span class="log-del" onclick="deleteLog('${pid}',${idx})">✕</span></span></div>`
  ).join('') || `<div class="no-logs">No notes yet</div>`;
  c.innerHTML=entries;
}

function confirmReset(){
  if(confirm('Reset all progress and notes? This cannot be undone.')){
    state={};logs={};
    saveState();
    renderPhases();
    updateStats();
  }
}

loadState();
renderPhases();
updateStats();
</script>
